name: FlatMarkDemo
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  FlatMark:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targetTemplates:
  Demo:
    type: application
    productName: FlatMarkDemo
    sources:
      - path: FlatMarkDemo
      - path: ../Support/FlatMarkFixtures
    dependencies:
      - package: FlatMark
        product: FlatMark
    settings:
      base:
        PRODUCT_NAME: FlatMarkDemo
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: FlatMark Demo
targets:
  FlatMarkDemo-iOS:
    templates: [Demo]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flatmark.FlatMarkFixtureHost
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  FlatMarkDemo-macOS:
    templates: [Demo]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flatmark.FlatMarkFixtureHost.macos
schemes:
  FlatMarkDemo-iOS:
    build:
      targets:
        FlatMarkDemo-iOS: all
  FlatMarkDemo-macOS:
    build:
      targets:
        FlatMarkDemo-macOS: all
